<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIA 隔熱紙下單小幫手</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 700px; background: #fff; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #051C3F; padding-bottom: 10px; color: #051C3F; margin-top: 0; }
        .section { margin-bottom: 25px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px; background-color: #fafafa; }
        .section-title { font-weight: bold; font-size: 1.1em; color: #051C3F; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.95em; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        .warning { color: #d9534f; font-size: 0.85em; font-weight: bold; margin-top: 5px; display: none; }
        .part-number-box { background: #eef2f7; padding: 10px; border-radius: 6px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font-family: monospace; font-size: 1.05em; font-weight: bold; }
        .btn-copy { background: #051C3F; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; transition: 0.2s; }
        .btn-copy:hover { background: #0a2d5c; }
        .btn-large { width: 100%; padding: 14px; font-size: 1.1em; font-weight: bold; margin-top: 10px; border-radius: 8px; }
        .vlt-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 5px; }
        #loading { text-align: center; font-size: 1.2em; color: #051C3F; padding: 50px 0; line-height: 1.6; }
        #main-content { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="loading">📡 正在從 CSV 讀取系統資料庫，請稍候...</div>

    <div id="main-content">
        <h2>🚗 KIA 隔熱紙下單小幫手</h2>

        <!-- 1. 基本車輛資訊 -->
        <div class="section">
            <div class="section-title">1. 基本車輛資訊</div>
            <div class="form-group">
                <label for="vin">車身碼 (必填，需為17碼英數字)</label>
                <input type="text" id="vin" placeholder="請輸入17碼車身碼" maxlength="17">
                <div id="vin-warning" class="warning">⚠ 車身碼需為17碼半形英數字 (已自動過濾空格與符號)</div>
            </div>
            <div class="form-group">
                <label for="car-type">車型 (必選)</label>
                <select id="car-type">
                    <option value="">-- 請選擇車型 --</option>
                </select>
                <div class="warning" style="display:block; color:#666; font-weight:normal;">選擇車型後，下方件號規格會自動連動比對</div>
            </div>
            <div class="form-group">
                <label for="car-color">車色 (選填)</label>
                <input type="text" id="car-color" placeholder="例如：星鑽銀">
            </div>
            <div class="form-group">
                <label for="salesman">業代 (必填)</label>
                <input type="text" id="salesman" placeholder="請輸入業代姓名">
            </div>
            <div class="form-group">
                <label for="location">存放(施工)地點 (必填)</label>
                <input type="text" id="location" placeholder="例如：內湖廠">
            </div>
            <div class="form-group">
                <label for="memo">其他 (選填，例如交車日、補充事項)</label>
                <textarea id="memo" rows="2" placeholder="請輸入備註事項"></textarea>
            </div>
        </div>

        <!-- 2. 前擋隔熱紙 -->
        <div class="section" id="sec-front">
            <div class="section-title">2. 隔熱紙型號選擇 【前擋】</div>
            <div class="form-group">
                <label>品牌</label>
                <select class="brand-select" data-pos="前檔" id="f-brand">
                    <option value="">-- 請選擇品牌 --</option>
                </select>
            </div>
            <div class="form-group">
                <label>系列</label>
                <select class="series-select" data-pos="前檔" id="f-series" disabled>
                    <option value="">-- 請先選品牌 --</option>
                </select>
            </div>
            <div class="form-group">
                <label>透光度 (建議法規70以上)</label>
                <select class="vlt-select" data-pos="前檔" id="f-vlt" disabled>
                    <option value="">-- 請先選系列 --</option>
                </select>
            </div>
            <div class="part-number-box">
                <span>件號：<span id="f-partno">---</span></span>
                <button class="btn-copy" onclick="copyText('f-partno')">複製件號</button>
            </div>
            <div id="f-match-warning" class="warning">⚠ 警告：所選件號適用車型與您選擇的車型不符！</div>
        </div>

        <!-- 3. 車身隔熱紙 -->
        <div class="section" id="sec-body">
            <div class="section-title">3. 隔熱紙型號選擇 【車身】</div>
            <div class="form-group">
                <label>品牌</label>
                <select class="brand-select" data-pos="車身" id="b-brand">
                    <option value="">-- 請選擇品牌 --</option>
                </select>
            </div>
            <div class="form-group">
                <label>系列</label>
                <select class="series-select" data-pos="車身" id="b-series" disabled>
                    <option value="">-- 請先選品牌 --</option>
                </select>
            </div>
            <div class="form-group">
                <label>車身各位置透光度：(建議法規40以上)</label>
                <div class="vlt-group">
                    <div>
                        <label style="font-size:0.85em; color:#555;">前窗</label>
                        <select class="vlt-select-multi" data-pos="車身" id="b-vlt-front" disabled><option value="">-- 請先選系列 --</option></select>
                    </div>
                    <div>
                        <label style="font-size:0.85em; color:#555;">後窗</label>
                        <select class="vlt-select-multi" data-pos="車身" id="b-vlt-back" disabled><option value="">-- 請先選系列 --</option></select>
                    </div>
                    <div>
                        <label style="font-size:0.85em; color:#555;">後擋</label>
                        <select class="vlt-select-multi" data-pos="車身" id="b-vlt-rear" disabled><option value="">-- 請先選系列 --</option></select>
                    </div>
                </div>
            </div>
            <div class="part-number-box">
                <span>件號：<span id="b-partno">---</span></span>
                <button class="btn-copy" onclick="copyText('b-partno')">複製件號</button>
            </div>
            <div id="b-match-warning" class="warning">⚠ 警告：所選件號適用車型與您選擇的車型不符！</div>
        </div>

        <!-- 4. 天窗隔熱紙 -->
        <div class="section" id="sec-sunroof">
            <div class="section-title">4. 隔熱紙型號選擇 【天窗】(若無可不選)</div>
            <div class="form-group">
                <label>品牌</label>
                <select class="brand-select" data-pos="天窗" id="s-brand">
                    <option value="">-- 不指定 / 無天窗 --</option>
                </select>
            </div>
            <div class="form-group">
                <label>系列</label>
                <select class="series-select" data-pos="天窗" id="s-series" disabled>
                    <option value="">-- 請先選品牌 --</option>
                </select>
            </div>
            <div class="form-group">
                <label>透光度</label>
                <select class="vlt-select" data-pos="天窗" id="s-vlt" disabled>
                    <option value="">-- 請先選系列 --</option>
                </select>
            </div>
            <div class="part-number-box">
                <span>件號：<span id="s-partno">---</span></span>
                <button class="btn-copy" onclick="copyText('s-partno')">複製件號</button>
            </div>
            <div id="s-match-warning" class="warning">⚠ 警告：所選件號適用車型與您選擇的車型不符！</div>
        </div>

        <!-- 5. 系統備註欄位複製區 -->
        <div class="section">
            <div class="section-title">5. 系統備註欄位複製區</div>
            <textarea id="output-summary" rows="6" readonly placeholder="請填妥上方資訊，此處將自動動態生成系統備註文字..."></textarea>
            <button class="btn-copy btn-large" onclick="copyText('output-summary', true)">一鍵複製系統備註文字</button>
        </div>
    </div>
</div>

<script>
    window.onerror = function(msg, url, line) {
        showError("網頁執行出錯（第 " + line + " 行）：" + msg);
        return false;
    };

    let carTypes = [];
    let products = [];

    function parseExcelCSV(text) {
        let lines = [];
        let row = [""];
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
            let c = text.charAt(i);
            let next = text.charAt(i + 1);

            if (c === '"') {
                if (inQuotes && next === '"') { 
                    row[row.length - 1] += '"'; i++; 
                } else { 
                    inQuotes = !inQuotes; 
                }
            } else if (c === ',' && !inQuotes) {
                row.push("");
            } else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && next === '\n') { i++; }
                lines.push(row);
                row = [""];
            } else {
                row[row.length - 1] += c;
            }
        }
        if (row.length > 1 || (row.length === 1 && row[0] !== "")) lines.push(row);
        return lines;
    }

    function loadFile(filename, callback) {
        let xhr = new XMLHttpRequest();
        xhr.open("GET", filename + "?v=" + Date.now(), true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {

if (xhr.status === 200) {
callback(null, xhr.responseText);
} else {
callback("無法讀取 " + filename + " (狀態碼: " + xhr.status + ")", null);
}
}
};
xhr.send();
}
function showError(msg) {
document.getElementById('loading').innerHTML = <div style="color: #d9534f; font-weight: bold; text-align: left; max-width: 500px; margin: 0 auto; background: #fff5f5; padding: 15px; border: 1px solid #ffcccc; border-radius: 8px;"> ❌ 系統載入失敗：<br> <span style="color: #333; font-weight: normal; font-size: 0.9em; display:block; margin-top: 10px;"> ${msg}<br><br> 請確認 <b>cartypes.csv</b> 與 <b>database.csv</b> 是否已成功上傳到 GitHub 的根目錄。 </span> </div>;
}
document.addEventListener("DOMContentLoaded", () => {
loadFile('cartypes.csv', function(err1, carCsv) {
if (err1) { showError(err1); return; }
loadFile('database.csv', function(err2, dbCsv) {
if (err2) { showError(err2); return; }
try {
// 1. 解析車型
let carData = parseExcelCSV(carCsv);
for (let i = 1; i < carData.length; i++) {
let row = carData[i];
if (row && row.length >= 2) {
carTypes.push({ code: row[0].trim(), name: row[1].trim() });
}
}
// 2. 解析隔熱紙資料
let dbData = parseExcelCSV(dbCsv);
for (let i = 1; i < dbData.length; i++) {
let row = dbData[i];
if (row && row.length >= 7 && row[0].trim() !== "") {
let carsArr = row[3].split(',').map(c => c.trim()).filter(c => c);
let vltArr = row[6].split(',').map(v => v.trim()).filter(v => v);
products.push({
brand: row[0].trim(),
id: row[1].trim(),
name: row[2].trim(),
cars: carsArr,
position: row[4].trim(),
series: row[5].trim(),
vlt: vltArr
});
}
}
if (carTypes.length === 0 || products.length === 0) {
showError("CSV 解析成功但無資料，請檢查表格內容是否正確填寫。");
return;
}
initApp();
document.getElementById('loading').style.display = 'none';
document.getElementById('main-content').style.display = 'block';
} catch (ex) {
showError("資料解析時發生崩潰: " + ex.message);
}
});
});
});
function initApp() {
const carSelect = document.getElementById('car-type');
carTypes.forEach(car => {
let opt = document.createElement('option');
opt.value = car.code;
opt.textContent = car.code + " - " + car.name;
carSelect.appendChild(opt);
});
['前檔', '車身', '天窗'].forEach(pos => {
const idMap = { '前檔': 'f-brand', '車身': 'b-brand', '天窗': 's-brand' };
const brandSelect = document.getElementById(idMap[pos]);
const brands = [...new Set(products.filter(p => p.position.includes(pos) || pos.includes(p.position)).map(p => p.brand))];
brands.forEach(b => {
let opt = document.createElement('option');
opt.value = b;
opt.textContent = b;
brandSelect.appendChild(opt);
});
});
setupEventListeners();
updateSummary();
}
function setupEventListeners() {
document.getElementById('vin').addEventListener('input', function() {
this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
document.getElementById('vin-warning').style.display = this.value.length === 17 ? 'none' : 'block';
updateSummary();
});
document.getElementById('car-type').addEventListener('change', () => { checkAllCompatibility(); updateSummary(); });
document.getElementById('car-color').addEventListener('input', updateSummary);
document.getElementById('salesman').addEventListener('input', updateSummary);
document.getElementById('location').addEventListener('input', updateSummary);
document.getElementById('memo').addEventListener('input', updateSummary);
document.querySelectorAll('.brand-select').forEach(el => {
el.addEventListener('change', function() {
handleBrandChange(this.dataset.pos, this.value);
});
});
document.querySelectorAll('.series-select').forEach(el => {
el.addEventListener('change', function() {
const pos = this.dataset.pos;
const brand = document.getElementById(pos === '前檔' ? 'f-brand' : pos === '車身' ? 'b-brand' : 's-brand').value;
handleSeriesChange(pos, brand, this.value);
});
});
document.querySelectorAll('.vlt-select, .vlt-select-multi').forEach(el => {
el.addEventListener('change', () => { checkAllCompatibility(); updateSummary(); });
});
}
function handleBrandChange(pos, brand) {
const prefix = pos === '前檔' ? 'f' : pos === '車身' ? 'b' : 's';
const seriesSel = document.getElementById(prefix + "-series");
seriesSel.innerHTML = brand ? '-- 請選擇系列 --' : '-- 請先選品牌 --';
seriesSel.disabled = !brand;
resetVltFields(pos);
document.getElementById(prefix + "-partno").textContent = '---';
document.getElementById(prefix + "-match-warning").style.display = 'none';
if (!brand) { updateSummary(); return; }
const seriesList = [...new Set(products.filter(p => p.brand === brand && (p.position.includes(pos) || pos.includes(p.position))).map(p => p.series))];
seriesList.forEach(s => {
let opt = document.createElement('option');
opt.value = s;
opt.textContent = s;
seriesSel.appendChild(opt);
});
updateSummary();
}
function handleSeriesChange(pos, brand, series) {
const prefix = pos === '前檔' ? 'f' : pos === '車身' ? 'b' : 's';
resetVltFields(pos, series);
if (!series) {
document.getElementById(prefix + "-partno").textContent = '---';
document.getElementById(prefix + "-match-warning").style.display = 'none';
updateSummary();
return;
}
const prod = products.find(p => p.brand === brand && p.series === series && (p.position.includes(pos) || pos.includes(p.position)));
if (prod) {
document.getElementById(prefix + "-partno").textContent = prod.id;
if (pos === '車身') {
['b-vlt-front', 'b-vlt-back', 'b-vlt-rear'].forEach(id => {
const el = document.getElementById(id);
prod.vlt.forEach(v => {
let opt = document.createElement('option');
opt.value = v;
opt.textContent = v + "%";
el.appendChild(opt);
});
});
} else {
const el = document.getElementById(prefix + "-vlt");
prod.vlt.forEach(v => {
let opt = document.createElement('option');
opt.value = v;
opt.textContent = v + "%";
el.appendChild(opt);
});
}
}
checkAllCompatibility();
updateSummary();
}
function resetVltFields(pos, hasSeries = false) {
const text = hasSeries ? '-- 請選擇透光度 --' : '-- 請先選系列 --';
if (pos === '車身') {
['b-vlt-front', 'b-vlt-back', 'b-vlt-rear'].forEach(id => {
const el = document.getElementById(id);
el.innerHTML = '' + text + '';
el.disabled = !hasSeries;
});
} else {
const prefix = pos === '前檔' ? 'f' : 's';
const el = document.getElementById(prefix + "-vlt");
el.innerHTML = '' + text + '';
el.disabled = !hasSeries;
}
}
function checkAllCompatibility() {
const currentCar = document.getElementById('car-type').value;
['前檔', '車身', '天窗'].forEach(pos => {
const prefix = pos === '前檔' ? 'f' : pos === '車身' ? 'b' : 's';
const brand = document.getElementById(prefix + "-brand").value;
const series = document.getElementById(prefix + "-series").value;
const warningEl = document.getElementById(prefix + "-match-warning");
if (!brand || !series || !currentCar) {
warningEl.style.display = 'none';
return;
}
const prod = products.find(p => p.brand === brand && p.series === series && (p.position.includes(pos) || pos.includes(p.position)));
if (prod) {
const isMatch = prod.cars.some(c => c.includes(currentCar) || currentCar.includes(c));
warningEl.style.display = isMatch ? 'none' : 'block';
}
});
}
function updateSummary() {
const vin = document.getElementById('vin').value;
const carType = document.getElementById('car-type').value;
const carColor = document.getElementById('car-color').value;
const salesman = document.getElementById('salesman').value;
const location = document.getElementById('location').value;
const memo = document.getElementById('memo').value;
const fBrand = document.getElementById('f-brand').value;
const fSeries = document.getElementById('f-series').value;
const fVlt = document.getElementById('f-vlt').value;
const fPart = document.getElementById('f-partno').innerText;
const bBrand = document.getElementById('b-brand').value;
const bSeries = document.getElementById('b-series').value;
const bVltF = document.getElementById('b-vlt-front').value;
const bVltB = document.getElementById('b-vlt-back').value;
const bVltR = document.getElementById('b-vlt-rear').value;
const bPart = document.getElementById('b-partno').innerText;
const sBrand = document.getElementById('s-brand').value;
const sSeries = document.getElementById('s-series').value;
const sVlt = document.getElementById('s-vlt').value;
const sPart = document.getElementById('s-partno').innerText;
let summary = "【車身號碼】:" + vin + "\n";
summary += "【車型規格】:" + carType + (carColor ? ' (' + carColor + ')' : '') + "\n";
summary += "【營業人員】:" + salesman + "\n";
summary += "【施工地點】:" + location + "\n";
summary += "【前擋規格】:" + (fBrand && fSeries && fVlt ? (fBrand + " " + fSeries + " (透光:" + fVlt + "%) [件號:" + fPart + "]") : '未選擇') + "\n";
let bodyText = '未選擇';
if (bBrand && bSeries && bVltF && bVltB && bVltR) {
bodyText = bBrand + " " + bSeries + " (前窗:" + bVltF + "% / 後窗:" + bVltB + "% / 後擋:" + bVltR + "%) [件號:" + bPart + "]";
}
summary += "【車身規格】:" + bodyText + "\n";
summary += "【天窗規格】:" + (sBrand && sSeries && sVlt ? (sBrand + " " + sSeries + " (透光:" + sVlt + "%) [件號:" + sPart + "]") : '無天窗/未選') + "\n";
summary += "【其他備註】:" + (memo ? memo : '無');
document.getElementById('output-summary').value = summary;
}
function copyText(elementId, isTextArea = false) {
const text = isTextArea ? document.getElementById(elementId).value : document.getElementById(elementId).innerText;
if (!text || text === '---') {
alert('沒有有效的內容可以複製！');
return;
}
navigator.clipboard.writeText(text).then(() => {
alert('已成功複製到剪貼簿！');
}).catch(err => {
alert('複製失敗，請手動複製。');
});
}
